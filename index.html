<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Username & Email Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            width: 400px;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        .box {
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 70%;
        }
        button {
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Username & Email Generator</h1>
        <div class="box">
            <label>Username:</label>
            <div class="input-group">
                <input type="text" id="username" readonly>
                <button id="copyUsername">Copy</button>
            </div>
        </div>
        <div class="box">
            <label>Email:</label>
            <div class="input-group">
                <input type="text" id="email" readonly>
                <button id="copyEmail">Copy</button>
            </div>
        </div>
    </div>
    <script>
        const usernameInput = document.getElementById("username");
        const emailInput = document.getElementById("email");
        const copyUsernameBtn = document.getElementById("copyUsername");
        const copyEmailBtn = document.getElementById("copyEmail");

        // Generate unique usernames in fshsh3_ua format
        function generateUsername() {
            const random = Math.random().toString(36).substring(2, 5); // Random 3 chars
            const suffix = Math.random().toString(36).substring(2, 4); // Random 2 chars
            return `fshsh3_${random}${suffix}`;
        }

        // Generate random emails
        function generateEmail() {
            const domains = ["example.com", "mail.com", "test.com"];
            const random = Math.random().toString(36).substring(2, 8);
            const domain = domains[Math.floor(Math.random() * domains.length)];
            return `${random}@${domain}`;
        }

        // Update username and email
        function updateFields() {
            usernameInput.value = generateUsername();
            emailInput.value = generateEmail();
        }

        // Copy functionality
        function copyToClipboard(inputField) {
            inputField.select();
            document.execCommand("copy");
        }

        // Event listeners for copy buttons
        copyUsernameBtn.addEventListener("click", () => copyToClipboard(usernameInput));
        copyEmailBtn.addEventListener("click", () => copyToClipboard(emailInput));

        // Initialize fields and update every 5 seconds
        updateFields();
        setInterval(updateFields, 5000);
    </script>
</body>
</html>
